name: Build macOS

on:
  workflow_call:
    inputs:
      ref:
        description: Git revision to build
        required: false
        type: string
        default: ''
    secrets:
      # Optional stable signing certificate (base64 .p12 and its export password).
      # Without them, builds keep the ad-hoc signature, e.g. for pull requests from forks.
      MACOS_SIGNING_CERTIFICATE:
        required: false
      MACOS_SIGNING_CERTIFICATE_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.region }}
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - region: cn
            artifact: CN
          - region: global
            artifact: Global
    env:
      WUWA_REGION: ${{ matrix.region }}
      WUWA_INSTALLER_MIRROR_BASE: ${{ github.server_url }}/${{ github.repository }}/releases/download/upstream-resources
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      CARGO_INCREMENTAL: '0'
      MACOS_SIGNING_CONFIGURED: ${{ secrets.MACOS_SIGNING_CERTIFICATE != '' && secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Read pinned official installer cache identity
        id: installer
        run: node scripts/installer-cache.mjs
      - name: Restore pinned official installer
        id: installer-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.installer.outputs.path }}
          key: ${{ steps.installer.outputs.key }}
      - name: Install build tools
        run: |
          test "$(uname -m)" = arm64
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          brew install sevenzip
      - uses: actions/cache/restore@v4
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: macos-arm64-${{ matrix.region }}-rust-1.97.1-${{ hashFiles('src-tauri/Cargo.lock') }}
      - run: npm ci
      - name: Prepare verified regional resources and native build inputs
        id: prepare
        run: npm run setup
      - name: Save verified official installer
        if: steps.prepare.outcome == 'success' && steps.installer-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.installer.outputs.path }}
          key: ${{ steps.installer.outputs.key }}
      - name: Test frontend contracts and native backend
        id: native-tests
        run: |
          npm test
          npm run test:rust
      - name: Build complete application
        run: npm run build -- -- --locked
      - name: Import stable signing certificate
        if: env.MACOS_SIGNING_CONFIGURED == 'true'
        env:
          MACOS_SIGNING_CERTIFICATE: ${{ secrets.MACOS_SIGNING_CERTIFICATE }}
          MACOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
        run: bash scripts/import-signing-certificate.sh
      - name: Verify and package ZIP and DMG
        run: |
          set -o pipefail
          npm run package 2>&1 | tee .work/package-macos.log
      - name: Remove temporary signing keychain
        if: always() && env.MACOS_SIGNING_KEYCHAIN != ''
        run: security delete-keychain "$MACOS_SIGNING_KEYCHAIN" || true
      - name: Keep packaging diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-package-diagnostics-${{ matrix.region }}
          path: .work/package-macos.log
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: WuwaTappo-${{ matrix.artifact }}-Mac-arm64
          path: |
            dist/*.zip
            dist/*.dmg
          if-no-files-found: error
          retention-days: 14
      - name: Save compiled Cargo dependencies
        if: always() && steps.native-tests.outcome == 'success' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
